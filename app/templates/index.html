<!DOCTYPE html>
<html>
<head>
    <title>RFP Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="layout">

    <main class="container">
        <h1>RFP Builder</h1>

        <section class="card rfp-builder">
            <div class="section-header">
                <div>
                    <h2>Vendor Response Builder</h2>
                    <p>Add questions one by one, paste a full list, or upload a Word RFP template.</p>
                </div>
                <div class="template-actions">
                    <input type="file" id="rfpTemplateFile" accept=".docx">
                    <button onclick="uploadRfpTemplate()">Upload Template</button>
                </div>
            </div>

            <div class="builder-grid">
                <div>
                    <label for="rfpSingleQuestion">One question</label>
                    <textarea id="rfpSingleQuestion" placeholder="Enter one RFP question..."></textarea>
                    <button onclick="addRfpQuestion()">Add Question</button>
                </div>

                <div>
                    <label for="rfpQuestionList">Question list</label>
                    <textarea id="rfpQuestionList" placeholder="Paste one question per line, or use numbered/bulleted lines..."></textarea>
                    <button onclick="addRfpQuestionList()">Add List</button>
                </div>
            </div>

            <div class="buttons">
                <button onclick="generateRfpAnswers()">Generate Answers</button>
                <button onclick="downloadRfpDocx()">Generate DOCX</button>
                <button class="secondary" onclick="clearRfpBuilder()">Clear</button>
            </div>

            <div id="rfpStatus" class="builder-status"></div>
            <div id="rfpItems" class="rfp-items"></div>
        </section>
    </main>

</div>

<script src="/static/app.js"></script>

</body>
</html>
